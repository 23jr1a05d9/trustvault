<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 420" role="img" aria-label="A shield protecting documents, with an audit log beside it">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".97"/>
      <stop offset="1" stop-color="#dbeafe" stop-opacity=".9"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#60a5fa" stop-opacity=".55"/>
      <stop offset="1" stop-color="#60a5fa" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="10" stdDeviation="9" flood-color="#020617" flood-opacity=".35"/>
    </filter>
  </defs>
  <style>
    .float { animation: float 6s ease-in-out infinite; }
    .f2 { animation-duration: 7s; animation-delay: -2s; }
    .f3 { animation-duration: 5.5s; animation-delay: -1s; }
    .f4 { animation-duration: 6.5s; animation-delay: -3s; }
    @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-12px); } }
    .spin { transform-origin: 260px 200px; animation: spin 28s linear infinite; }
    .spin-rev { transform-origin: 260px 200px; animation: spin 36s linear infinite reverse; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .pulse { transform-origin: 260px 200px; animation: pulse 4s ease-in-out infinite; }
    @keyframes pulse { 0%, 100% { opacity: .6; transform: scale(.96); } 50% { opacity: 1; transform: scale(1.05); } }
    .shield { transform-origin: 260px 200px; animation: breathe 5s ease-in-out infinite; }
    @keyframes breathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.03); } }
    .check { stroke-dasharray: 130; stroke-dashoffset: 130; animation: draw 5s ease-in-out infinite; }
    @keyframes draw { 0%, 10% { stroke-dashoffset: 130; } 35%, 85% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: 130; } }
    .dash { animation: flow 2.5s linear infinite; }
    @keyframes flow { to { stroke-dashoffset: -20; } }
    .r { animation: rowpulse 4.5s ease-in-out infinite; }
    .r2 { animation-delay: 1.5s; }
    .r3 { animation-delay: 3s; }
    @keyframes rowpulse { 0%, 100% { opacity: .4; } 20%, 45% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .check { stroke-dashoffset: 0; } }
  </style>

  <circle class="pulse" cx="260" cy="200" r="170" fill="url(#glow)"/>

  <g class="spin">
    <circle cx="260" cy="200" r="150" fill="none" stroke="#93c5fd" stroke-opacity=".5" stroke-width="1.5" stroke-dasharray="4 10"/>
    <circle cx="410" cy="200" r="6" fill="#5eead4"/>
    <circle cx="110" cy="200" r="4" fill="#93c5fd"/>
  </g>
  <g class="spin-rev">
    <circle cx="260" cy="200" r="115" fill="none" stroke="#5eead4" stroke-opacity=".35" stroke-width="1.5" stroke-dasharray="2 8"/>
    <circle cx="260" cy="85" r="5" fill="#a5f3fc"/>
  </g>

  <path class="dash" d="M136 150 C 170 160, 190 175, 204 186" fill="none" stroke="#93c5fd" stroke-opacity=".7" stroke-width="2" stroke-dasharray="4 6"/>
  <path class="dash" d="M392 120 C 360 135, 345 150, 332 168" fill="none" stroke="#93c5fd" stroke-opacity=".7" stroke-width="2" stroke-dasharray="4 6"/>

  <g class="shield" filter="url(#soft)">
    <path d="M260 108 L336 136 V200 C336 252 300 290 260 308 C220 290 184 252 184 200 V136 Z" fill="url(#g1)"/>
    <path d="M260 124 L322 146 V200 C322 244 292 276 260 292 C228 276 198 244 198 200 V146 Z" fill="none" stroke="#ffffff" stroke-opacity=".35" stroke-width="2"/>
    <polyline class="check" points="226,204 252,230 298,176" fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g class="float">
    <rect x="40" y="70" width="96" height="124" rx="12" fill="url(#g2)" filter="url(#soft)"/>
    <rect x="54" y="88" width="48" height="8" rx="4" fill="#1e3a8a" opacity=".85"/>
    <rect x="54" y="108" width="68" height="6" rx="3" fill="#94a3b8"/>
    <rect x="54" y="122" width="60" height="6" rx="3" fill="#cbd5e1"/>
    <rect x="54" y="136" width="66" height="6" rx="3" fill="#cbd5e1"/>
    <circle cx="112" cy="172" r="14" fill="#0ea5e9"/>
    <rect x="105" y="170" width="14" height="10" rx="2" fill="#ffffff"/>
    <path d="M108 170 v-3 a4 4 0 0 1 8 0 v3" fill="none" stroke="#ffffff" stroke-width="2"/>
  </g>

  <g class="float f2">
    <rect x="392" y="60" width="88" height="112" rx="12" fill="url(#g2)" filter="url(#soft)"/>
    <rect x="406" y="78" width="44" height="8" rx="4" fill="#0f766e" opacity=".85"/>
    <rect x="406" y="98" width="60" height="6" rx="3" fill="#94a3b8"/>
    <rect x="406" y="112" width="52" height="6" rx="3" fill="#cbd5e1"/>
    <rect x="406" y="126" width="58" height="6" rx="3" fill="#cbd5e1"/>
    <circle cx="460" cy="152" r="12" fill="#14b8a6"/>
    <polyline points="454,152 459,157 467,147" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g class="float f3">
    <rect x="30" y="262" width="132" height="36" rx="18" fill="#ffffff" fill-opacity=".94" filter="url(#soft)"/>
    <circle cx="50" cy="280" r="11" fill="#14b8a6"/>
    <text x="68" y="284" font-family="system-ui, Segoe UI, sans-serif" font-size="12" font-weight="600" fill="#0f172a">Ravi · can read</text>
  </g>

  <g class="float f4">
    <rect x="372" y="196" width="130" height="34" rx="17" fill="#fee2e2" fill-opacity=".95" filter="url(#soft)"/>
    <circle cx="391" cy="213" r="10" fill="#ef4444"/>
    <path d="M386 208 l10 10 M396 208 l-10 10" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    <text x="408" y="217" font-family="system-ui, Segoe UI, sans-serif" font-size="12" font-weight="600" fill="#7f1d1d">Stranger · refused</text>
  </g>

  <g>
    <rect x="296" y="262" width="196" height="112" rx="14" fill="#0b1f47" fill-opacity=".88" stroke="#3b82f6" stroke-opacity=".55" filter="url(#soft)"/>
    <text x="314" y="285" font-family="system-ui, Segoe UI, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5" fill="#93c5fd">AUDIT LOG</text>
    <g class="r">
      <circle cx="320" cy="305" r="5" fill="#22c55e"/>
      <rect x="336" y="302" width="100" height="6" rx="3" fill="#64748b"/>
      <rect x="444" y="302" width="30" height="6" rx="3" fill="#22c55e" opacity=".7"/>
    </g>
    <g class="r r2">
      <circle cx="320" cy="327" r="5" fill="#ef4444"/>
      <rect x="336" y="324" width="84" height="6" rx="3" fill="#64748b"/>
      <rect x="444" y="324" width="30" height="6" rx="3" fill="#ef4444" opacity=".8"/>
    </g>
    <g class="r r3">
      <circle cx="320" cy="349" r="5" fill="#22c55e"/>
      <rect x="336" y="346" width="108" height="6" rx="3" fill="#64748b"/>
      <rect x="444" y="346" width="30" height="6" rx="3" fill="#22c55e" opacity=".7"/>
    </g>
  </g>
</svg>